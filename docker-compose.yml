services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_hotel_dev}
    ports:
      - "5432:5432"
    volumes:
      - hotel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://db:5432/hotel
      DB_USER: hotel
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local_hotel_dev}
      DB_DRIVER: org.postgresql.Driver
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  hotel-postgres:
